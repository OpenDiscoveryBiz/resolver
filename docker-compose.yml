x-tmpfs: &tmpfs
  - type: tmpfs
    target: /tmp
    tmpfs:
      mode: 0777
      uid: 10001
      gid: 10001
  - type: tmpfs
    target: /data
    tmpfs:
      mode: 0777
      uid: 10001
      gid: 10001
  - type: tmpfs
    target: /config
    tmpfs:
      mode: 0777
      uid: 10001
      gid: 10001
  - type: tmpfs
    target: /app/storage
    tmpfs:
      mode: 0777
      uid: 10001
      gid: 10001
  - type: tmpfs
    target: /app/bootstrap/cache
    tmpfs:
      mode: 0777
      uid: 10001
      gid: 10001

services:
  resolver:
    build: .
    read_only: true
    privileged: false
    user: "10001:10001"
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    ports:
      - "18083:8000"
    environment:
      APP_URL: http://localhost:18083
      PROVIDER_ROOT: http://root-provider:8000
      APP_KEY: ${APP_KEY:?php artisan key:generate}
      LOG_CHANNEL: stderr
      OCTANE_STATE_FILE: /tmp/octane-server-state.json
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      HOME: /data
    tmpfs: *tmpfs
    networks:
      - opendiscovery

# Created by root-provider compose; start that first.
networks:
  opendiscovery:
    name: opendiscovery
    external: true
