x-tmpfs: &tmpfs
  - /tmp:mode=1777
  - /data:mode=1777
  - /config:mode=1777
  - /app/storage:mode=1777
  - /app/bootstrap/cache:mode=1777

services:
  resolver:
    build: .
    read_only: true
    privileged: false
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
      - SETUID
      - SETGID
      - CHOWN
    ports:
      - "18083:8000"
    environment:
      APP_URL: http://localhost:18083
      PROVIDER_ROOT: http://root-provider:8000
      APP_KEY: ${APP_KEY:?php artisan key:generate}
      LOG_CHANNEL: stderr
      OCTANE_STATE_FILE: /tmp/octane-server-state.json
      XDG_CONFIG_HOME: /config
      XDG_DATA_HOME: /data
      HOME: /data
    tmpfs: *tmpfs
    networks:
      - opendiscovery

# Created by root-provider compose; start that first.
networks:
  opendiscovery:
    name: opendiscovery
    external: true
